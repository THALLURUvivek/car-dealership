<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Apex Auto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--dark-bg), var(--darker-bg)); padding: 2rem;">
        <div class="container text-center">
            <div style="max-width: 600px; margin: 0 auto;">
                <div style="font-size: 8rem; font-weight: 800; color: var(--primary-color); font-family: 'Playfair Display', serif; line-height: 1; margin-bottom: 1rem;">404</div>
                <h1 style="font-size: 2.5rem; margin-bottom: 1rem; color: var(--light-text);">Page Not Found</h1>
                <p style="font-size: 1.2rem; color: var(--gray-text); margin-bottom: 2rem;">Oops! The page you're looking for doesn't exist or is under construction.</p>
                <p style="color: var(--gray-text); margin-bottom: 3rem;">This link is not available yet. Please check back soon or return to the homepage.</p>
                <div class="d-flex gap-3 justify-content-center flex-wrap">
                    <a href="home.html" class="btn btn-primary btn-lg"><i class="fas fa-home me-2"></i>Go to Home</a>
                    <a href="javascript:history.back()" class="btn btn-outline-light btn-lg"><i class="fas fa-arrow-left me-2"></i>Go Back</a>
                </div>
                <div style="margin-top: 3rem;">
                    <p style="color: var(--gray-text); margin-bottom: 1rem;">Or contact us for assistance</p>
                    <a href="contact.html" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Contact Support <i class="fas fa-envelope ms-1"></i></a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
